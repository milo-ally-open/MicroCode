name: Release CLI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: windows
            arch: x64
            runner: windows-2025
          - platform: windows
            arch: arm64
            runner: windows-11-arm
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify tag matches package version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$package_version" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Package native CLI
        run: bun run package:cli

      - name: Verify packaged executable
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            ./packaging/out/staging/microcode-cli-v${release_version}-windows-${{ matrix.arch }}/bin/microcode.exe --version
          else
            ./packaging/out/staging/microcode-cli-v${release_version}-${{ matrix.platform }}-${{ matrix.arch }}/bin/microcode --version
          fi

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          bun -e '
            import { createHash } from "node:crypto";
            import { readdir, readFile, writeFile } from "node:fs/promises";
            const files = await readdir("packaging/out");
            const archive = files.find((file) => /\.(zip|tar\.gz)$/.test(file));
            if (!archive) throw new Error("CLI archive was not produced");
            const digest = createHash("sha256").update(await readFile(`packaging/out/${archive}`)).digest("hex");
            await writeFile(`packaging/out/${archive}.sha256`, `${digest}  ${archive}\n`);
          '

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: packaging/out/microcode-cli-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete asset matrix
        shell: bash
        run: |
          expected=6
          archives=$(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          checksums=$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)
          if [[ "$archives" -ne "$expected" || "$checksums" -ne "$expected" ]]; then
            echo "Expected $expected archives and checksums, found $archives archives and $checksums checksums" >&2
            exit 1
          fi
          for checksum in release-assets/*.sha256; do
            (cd release-assets && sha256sum --check "${checksum##*/}")
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print | sort)
          gh release create "$RELEASE_TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
